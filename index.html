<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Never Gonna Give You Up</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        img {
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }
        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-family: sans-serif;
            z-index: 9999;
            cursor: pointer;
            text-align: center;
            padding: 20px;
        }
        #overlay:hover { background: rgba(0,0,0,0.7); }
    </style>
</head>
<body>

    <div id="overlay">🔊 Klik untuk masuk</div>

    <img src="rickroll.gif" alt="Rick Roll">

    <audio id="bgMusic" loop preload="auto">
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('bgMusic');
        const overlay = document.getElementById('overlay');
        audio.volume = 1.0;

        function playMusic() {
            const p = audio.play();
            if (p !== undefined) {
                p.then(() => {
                    overlay.style.display = 'none';
                }).catch((err) => {
                    console.warn('Play gagal:', err);
                });
            }
        }

        // Coba autoplay dulu
        window.addEventListener('load', () => {
            const p = audio.play();
            if (p !== undefined) {
                p.then(() => {
                    overlay.style.display = 'none'; // autoplay berhasil
                }).catch(() => {
                    // autoplay gagal, biarkan overlay
                });
            }
        });

        // Klik overlay untuk mainkan
        overlay.addEventListener('click', playMusic, { once: true });
    </script>

</body>
</html>
